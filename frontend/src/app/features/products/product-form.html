<div class="page-header">
  <h1>{{ id() ? 'Editar produto' : 'Novo produto' }}</h1>
</div>

@if (error()) {
  <div class="alert">{{ error() }}</div>
}

<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  <label class="form-field">
    Nome
    <input formControlName="name" />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <span class="field-error">Informe um nome com 2 a 120 caracteres.</span>
    }
  </label>

  <label class="form-field">
    Preço (R$)
    <input type="number" step="0.01" min="0.01" formControlName="price" />
    @if (form.controls.price.touched && form.controls.price.invalid) {
      <span class="field-error">O preço deve ser maior que zero.</span>
    }
  </label>

  @if (id()) {
    <p class="muted">
      Alterar o preço não afeta pedidos já criados — eles mantêm o preço da época da compra.
    </p>
  }

  <div class="row">
    <button type="submit" class="primary" [disabled]="saving()">Salvar</button>
    <a class="button" routerLink="/products">Cancelar</a>
  </div>
</form>
